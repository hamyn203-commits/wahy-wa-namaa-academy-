name: Session Reminders Cron

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  dispatch-reminders:
    name: Trigger Session Reminders
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      API_URL: ${{ vars.PRODUCTION_API_URL || secrets.PRODUCTION_API_URL || 'https://api.wahywanamaa.com' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Trigger GET /api/cron/reminders
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::notice::CRON_SECRET is not configured yet in repository secrets; skipping reminder trigger."
            exit 0
          fi
          case "$API_URL" in
            https://*) ;;
            *)
              echo "::error::PRODUCTION_API_URL must start with https://"
              exit 1
              ;;
          esac
          HTTP_STATUS=$(printf 'header = "Authorization: Bearer %s"\n' "$CRON_SECRET" | \
            curl -sS --proto '=https' --tlsv1.2 --config - -o /tmp/cron-response.json -w "%{http_code}" \
            "${API_URL%/}/api/cron/reminders")
          cat /tmp/cron-response.json || true
          echo ""
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Reminder cron returned HTTP $HTTP_STATUS"
            exit 1
          fi
