name: Session Reminders Cron

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  dispatch-reminders:
    name: Trigger Session Reminders
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      API_URL: ${{ secrets.PRODUCTION_API_URL || 'https://api.wahywanamaa.com' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Trigger GET /api/cron/reminders
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::notice::CRON_SECRET is not configured yet in repository secrets; skipping reminder trigger."
            exit 0
          fi
          HTTP_STATUS=$(curl -sS -o /tmp/cron-response.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${API_URL%/}/api/cron/reminders")
          cat /tmp/cron-response.json || true
          echo ""
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Reminder cron returned HTTP $HTTP_STATUS"
            exit 1
          fi
