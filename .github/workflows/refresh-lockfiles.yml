name: Refresh npm lockfiles

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Refresh frontend lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Refresh backend lockfile
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Open PR with refreshed lockfiles if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- package-lock.json backend/package-lock.json; then
            echo "Lockfiles already current."
            exit 0
          fi

          BRANCH="chore/refresh-lockfiles-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add package-lock.json backend/package-lock.json
          git commit -m "chore: refresh npm lockfiles"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -u origin "$BRANCH"
          gh pr create --base master --head "$BRANCH" --title "chore: refresh npm lockfiles" --body "Automated lockfile refresh via workflow_dispatch (requires CI before merge)."
